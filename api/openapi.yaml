          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /boards/{boardId}/cards:
    get:
      operationId: getBoardCards
      tags: [ Boards ]
      summary: Карточки доски по колонкам
      description: >-
        Все колонки доски по порядку; внутри колонки по rank. Задачи отбираются
        по статусу колонки, базовому фильтру доски (задаётся при создании доски,
        наружу не отдаётся), пользовательским фильтрам и окну Done (в колонке
        категории done - только закрытые за последние doneWindowDays дней).
        Значение фильтра не UUID и не допустимая константа - 422
        fields.<параметр> = invalid; корректный UUID, которого нет в проекте,
        игнорируется. Удалённая или чужая доска - 404. Право: `board-view`.
      x-permission: board-view
      parameters:
        - $ref: '#/components/parameters/BoardId'
        - name: q
          in: query
          description: Подстрока названия; по ключу ищется только запрос, похожий на номер
            (12, -12, DEMO-12; без учёта регистра). Остальные запросы (de, mo,
            demo) ищут только по названию
          schema:
            type: string
            maxLength: 100
        - name: assignee
          in: query
          description: UUID участников, me, none через запятую
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              anyOf:
                - type: string
                  format: uuid
                - type: string
                  enum: [ me, none ]
        - name: reviewer
          in: query
          description: UUID участников, me, none через запятую
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              anyOf:
                - type: string
                  format: uuid
                - type: string
                  enum: [ me, none ]
        - name: priority
          in: query
          description: low, medium, high, critical через запятую
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/Priority'
        - name: type
          in: query
          description: task, bug, subtask через запятую
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              $ref: '#/components/schemas/TaskType'
        - name: subsystem
          in: query
          description: UUID направлений или none через запятую
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              anyOf:
                - type: string
                  format: uuid
                - type: string
                  enum: [ none ]
        - name: tag
          in: query
          description: UUID тегов через запятую
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            items:
              type: string
              format: uuid
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardCards'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}/move:
    post:
      operationId: moveTask
      tags: [ Tasks ]
      summary: Сменить статус и позицию карточки
      description: >-
        prevId и nextId - соседи, которых пользователь видит на доске в момент
        переноса: prevId - карточка непосредственно ВЫШЕ, nextId -
        непосредственно НИЖЕ. Карточка встаёт между ними, даже если между этими
        соседями есть задачи, скрытые фильтром доски или окном Done: фронт их не
        передаёт. Если соседей нет, карточка встаёт в конец колонки; если
        передан один сосед, вплотную к нему. 409 stale_position - если сосед не
        найден в проекте, находится в другом статусе, чем целевой, совпадает с
        переносимой задачей или prevId стоит ниже nextId. В теле null у prevId и
        nextId равен отсутствию поля. Повтор с теми же соседями при неизменной
        доске успешен. reason обязателен, если статус меняется на статус с
        requiresReason (иначе 422 fields.reason = required), и сохраняется
        комментарием status_reason. Перестановка внутри колонки не меняет
        updatedAt и историю. Если статус не меняется, reason игнорируется.
        Право: `task-move`.
      x-permission: task-move
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}/comments:
    get:
