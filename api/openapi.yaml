          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
  parameters:
    InvitationToken:
      name: token
      in: path
      required: true
      schema:
        type: string
    ProjectId:
      name: projectId
      in: path
      required: true
      description: UUID проекта
      schema:
        type: string
        format: uuid
    BoardId:
      name: boardId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskId:
      name: taskId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TaskKey:
      name: key
      in: path
      required: true
      description: Ключ задачи вида PROJ-123 (без учёта регистра)
      schema:
        type: string
        pattern: '^[A-Za-z][A-Za-z0-9]{1,5}-[0-9]+$'
    LinkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UrlId:
      name: urlId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorklogId:
      name: worklogId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Неверный формат запроса (code bad_request)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Ошибка сервера (code internal_error, в error.requestId -
        идентификатор запроса)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthenticated:
      description: Нет сессии (code unauthenticated)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidCredentials:
      description: Неверный логин или пароль (code invalid_credentials)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Нет права или не прошла проверка Origin (code forbidden)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Не найдено (code not_found)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvitationInvalid:
      description: Приглашение недействительно (code invitation_invalid)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: >-
        Конфликт состояния (code username_taken, name_taken, link_exists,
        link_cycle, stale_position - какой именно, сказано в операции). Фронт на
        любой 409 показывает message и перезапрашивает данные
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationFailed:
      description: Не прошла валидация (code validation_failed, поле fields)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyAttempts:
      description: Превышен лимит попыток (code too_many_attempts)
      headers:
        Retry-After:
          description: Через сколько секунд можно повторить запрос
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorCode:
      type: string
      description: Стабильный код ошибки (snake_case); HTTP-статус по кодам - в
        docs-short/backend/00, раздел 3. Фронт ветвится только по HTTP-статусу,
        код нужен для диагностики
      enum:
        - unauthenticated
        - invalid_credentials
        - forbidden
        - not_found
        - invitation_invalid
        - bad_request
        - validation_failed
        - too_many_attempts
        - internal_error
        - username_taken
        - name_taken
        - link_exists
        - link_cycle
        - stale_position
    FieldErrorReason:
      type: string
      description: Причина ошибки поля в error.fields (при validation_failed и name_taken)
      enum:
        - required
        - invalid
        - too_long
        - too_many
        - taken
        - duplicate
        - not_found
        - not_member
        - not_allowed
        - reason_required
        - same_task
        - in_future
    ErrorResponse:
      type: object
      required: [ error ]
      properties:
        error:
          type: object
          required: [ code, message ]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
              description: Текст на русском
            requestId:
              type: string
              description: Только в теле 5xx; равен заголовку X-Request-Id ответа
            fields:
              type: object
              description: Только validation_failed и name_taken; ключ - имя поля запроса
              additionalProperties:
                $ref: '#/components/schemas/FieldErrorReason'
    User:
      type: object
      required: [ id, name, username ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        username:
          type: string
          pattern: ^[a-z0-9_]{3,32}$
    UserResponse:
      type: object
      required: [ user ]
      properties:
        user:
          $ref: '#/components/schemas/User'
    MeResponse:
      type: object
      required: [ user ]
      properties:
        user:
          $ref: '#/components/schemas/User'
    LoginRequest:
      type: object
      required: [ username, password ]
      properties:
        username:
          type: string
        password:
          type: string
          maxLength: 128
    InvitationInfo:
      type: object
      required: [ name, kind, username ]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [ new, reissue ]
          description: >-
            new - у пользователя ещё нет логина, при принятии username
            обязателен; reissue - логин уже есть (новая ссылка вместо забытого
            пароля), он возвращается в username и при принятии не передаётся
        username:
          type: string
          nullable: true
          description: Только для kind=reissue; для kind=new - null
    UsernameAvailability:
      type: object
      required: [ available, reason ]
      properties:
        available:
          type: boolean
        reason:
          type: string
          enum: [ taken, invalid ]
          nullable: true
    AcceptInvitationRequest:
      type: object
      description: username обязателен для kind=new и не передаётся для kind=reissue
      properties:
        username:
          type: string
          pattern: '^[a-z0-9_]{3,32}$'
          description: >
            Обязателен для kind=new (в обоих способах), не передаётся для
            reissue. Только в нижнем регистре, ^[a-z0-9_]{3,32}$: заглавные
            сервер не приводит, а отклоняет (422 fields.username = invalid).
            Приведение к нижнему регистру - на фронте
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: Не короче 8 символов, хотя бы одна буква и одна цифра
      required: [ password ]
    UpdateProfileRequest:
      type: object
      required: [ name ]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ChangePasswordRequest:
      type: object
      required: [ current, next ]
      properties:
        current:
          type: string
          maxLength: 128
          description: Текущий пароль; неверный - 422 (fields.current = invalid)
        next:
          type: string
          minLength: 8
          maxLength: 128
    ProjectRole:
      type: string
      enum: [ owner, admin, member, viewer ]
    ProjectPermission:
      type: string
      description: Ключи проекта (docs-short/08, раздел 4). Тип Permission на фронте
        строится из этого enum; x-permission каждой операции совпадает с одним
        из значений
      enum:
        - project-view
        - board-view
        - task-view
        - member-list
        - comment-create
        - comment-update
        - comment-delete
        - task-create
        - task-update
        - task-move
        - link-manage
        - worklog-create
        - worklog-update
        - worklog-delete
