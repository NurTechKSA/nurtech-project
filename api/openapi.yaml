openapi: 3.0.3
info:
  title: Task manager API (MVP)
  version: 0.1.0
  description: >-
    Контракт MVP учебного таск-менеджера: доска задач и карточка задачи.
    Подмножество полного контракта docs/backend/openapi/openapi.yaml 0.7.0 с
    упрощениями; отличия - в CHANGELOG.md рядом. Поведение -
    docs-short/backend/00-04. Параметр projectId - UUID проекта. У каждой ручки
    указано x-permission (ключ из docs-short/08, раздел 4), none (достаточно
    сессии) или x-public. Пользователей, проекты, участников и
    ссылки-приглашения заводит разработчик бэкенда служебными средствами, в
    контракт они не входят. Источник истины - этот файл; изменение контракта -
    PR с повышением minor в info.version и строкой в CHANGELOG.md.
servers:
  - url: /api
tags:
  - name: Session
  - name: Invitations
  - name: Profile
  - name: Projects
  - name: Members
  - name: Statuses
  - name: Boards
  - name: Subsystems
  - name: Tags
  - name: Tasks
  - name: Links
  - name: Comments
  - name: Worklogs
security:
  - cookieAuth: []
paths:
  /auth/login:
    post:
      operationId: login
      tags: [ Session ]
      summary: Вход по логину и паролю
      description: 'Неверный логин или пароль, а также тело, не прошедшее проверку
        длины, - 401 invalid_credentials (одинаковый ответ). Публичная ручка,
        сессия не нужна.'
      x-public: true
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Сессия создана (Set-Cookie sid)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidCredentials'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      operationId: logout
      tags: [ Session ]
      summary: Выход
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '204':
          description: Сессия отозвана
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      operationId: getMe
      tags: [ Session ]
      summary: Текущий пользователь
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}:
    get:
      operationId: getInvitation
      tags: [ Invitations ]
      summary: Данные приглашения
      description: 'Публичная ручка, сессия не нужна.'
      x-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/username-available:
    get:
      operationId: checkUsernameAvailable
      tags: [ Invitations ]
      summary: Проверка логина на занятость
      description: 'Публичная ручка, сессия не нужна.'
      x-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsernameAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '500':
          $ref: '#/components/responses/InternalError'
  /invitations/{token}/accept:
    post:
      operationId: acceptInvitation
      tags: [ Invitations ]
      summary: Принять приглашение
      description: >-
        Для kind=new username обязателен; для kind=reissue username не
        передаётся (422 fields.username = not_allowed). Занятый логин - 409
        username_taken. Использованное, просроченное или отозванное приглашение
        - 404 invitation_invalid. Приглашение одноразовое: из двух одновременных
        запросов успешен один, второй получает 404 invitation_invalid. Успех:
        200 MeResponse (как GET /auth/me) и сессия (Set-Cookie sid). Публичная
        ручка, сессия не нужна.
      x-public: true
      security: []
      parameters:
        - $ref: '#/components/parameters/InvitationToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Пароль установлен, сессия создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/InvitationInvalid'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile:
    patch:
      operationId: updateProfile
      tags: [ Profile ]
      summary: Изменить имя
      description: 'Право: `none` (достаточно сессии).'
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /profile/password:
    post:
      operationId: changePassword
      tags: [ Profile ]
      summary: Сменить пароль
      description: >-
        Неверный current - 422 fields.current = invalid; неверные попытки
        считаются теми же счётчиками, что и вход, при превышении - 429
        too_many_attempts. Слабый next - 422 fields.next = invalid. Успех
        отзывает остальные сессии пользователя, текущая остаётся. Право: `none`
        (достаточно сессии).
      x-permission: none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменён
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/TooManyAttempts'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects:
    get:
      operationId: listMyProjects
      tags: [ Projects ]
      summary: Проекты текущего пользователя
      description: 'Только проекты, где пользователь участник; порядок по названию.
        Право: `none` (достаточно сессии).'
      x-permission: none
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/me:
    get:
      operationId: getProjectMe
      tags: [ Projects ]
      summary: Роль и права текущего пользователя в проекте
      description: 'Запрашивается при входе в проект и после любого 403. Право:
        `project-view`.'
      x-permission: project-view
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectMe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/members:
    get:
      operationId: listMembers
      tags: [ Members ]
      summary: Участники проекта
      description: 'Все участники проекта по имени, без пагинации; источник значений
        для исполнителя, ревьюера и фильтров. Право: `member-list`.'
      x-permission: member-list
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Весь список без пагинации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/statuses:
    get:
      operationId: listStatuses
      tags: [ Statuses ]
      summary: Статусы проекта по порядку
      description: 'Статусы в порядке workflow; источник значений для поля "Статус" и
        диалога создания. Право: `project-view`.'
      x-permission: project-view
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/boards:
    get:
      operationId: listBoards
      tags: [ Boards ]
      summary: Доски проекта в порядке создания
      description: 'Доски в порядке создания; шаблон Dev team создаёт "Разработку",
        затем "Планирование". Колонки доски - в порядке отображения. Право:
        `board-view`.'
      x-permission: board-view
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/subsystems:
    get:
      operationId: listSubsystems
      tags: [ Subsystems ]
      summary: Направления проекта
      description: 'Право: `task-view`.'
      x-permission: task-view
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubsystemList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/tags:
    get:
      operationId: listTags
      tags: [ Tags ]
      summary: Теги проекта
      description: 'Все теги проекта по названию, без пагинации. Право: `task-view`.'
      x-permission: task-view
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TagList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createTag
      tags: [ Tags ]
      summary: Создать тег (на лету из задачи)
      description: 'Тег с таким названием уже есть (без учёта регистра) - 409
        name_taken с fields.name = taken. Право: `tag-create`.'
      x-permission: tag-create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NameRequest'
      responses:
        '201':
          description: Создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/tasks:
    post:
      operationId: createTask
      tags: [ Tasks ]
      summary: Создать задачу или подзадачу
      description: >-
        В теле null у statusId, priority и parentId равен отсутствию поля.
        statusId по умолчанию - первый статус проекта без requiresReason; статус
        с requiresReason - 422 fields.statusId = reason_required. Причины 422,
        которые не выражает схема: type = subtask без parentId - fields.parentId
        = required; parentId у task и bug - fields.parentId = not_allowed;
        родитель - подзадача - fields.parentId = invalid; исполнитель или
        ревьюер не участник проекта - fields.<поле> = not_member. Новая задача
        встаёт в конец колонки своего статуса. Право: `task-create`.
      x-permission: task-create
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/tasks/by-key/{key}:
    get:
      operationId: getTaskByKey
      tags: [ Tasks ]
      summary: Задача по ключу PROJ-123
      description: 'Префикс ключа должен совпасть с ключом проекта из пути, иначе 404.
        Право: `task-view`.'
      x-permission: task-view
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - $ref: '#/components/parameters/TaskKey'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /projects/{projectId}/tasks/search:
    get:
      operationId: searchTasks
      tags: [ Tasks ]
      summary: Поиск задач для выбора родителя и связи
      description: 'Право: `task-view`.'
      x-permission: task-view
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: q
          in: query
          description: Подстрока названия; по ключу ищется только запрос, похожий на номер
            (12, -12, DEMO-12; без учёта регистра). Остальные запросы (de, mo,
            demo) ищут только по названию; пусто - последние обновлённые
          schema:
            type: string
            maxLength: 100
        - name: types
          in: query
          description: task, bug, subtask через запятую
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            uniqueItems: true
            items:
              $ref: '#/components/schemas/TaskType'
        - name: excludeId
          in: query
          description: Исключить задачу
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          description: 1-20, по умолчанию 10
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSearchResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}:
    patch:
      operationId: updateTask
      tags: [ Tasks ]
      summary: Изменить поля задачи (статус только через move)
      description: >-
        tagIds заменяет набор целиком. Отсутствие поля - не менять, null -
        очистить (только у assigneeId, reviewerId, subsystemId, dueDate,
        estimateMinutes, description); null у title, type, priority - 422
        fields.<поле> = invalid. Поля, которых нет в схеме (statusId, parentId и
        любые другие), - 422 fields.<поле> = invalid. type = subtask, а также
        любой type у подзадачи - 422 fields.type = invalid. Статус меняется
        только через POST /tasks/{taskId}/move. Право: `task-update`.
      x-permission: task-update
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}/history:
    get:
      operationId: listTaskHistory
      tags: [ Tasks ]
      summary: История изменений от новых к старым
      description: 'Право: `task-view`.'
      x-permission: task-view
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}/links:
    post:
      operationId: createTaskLink
      tags: [ Links ]
      summary: Добавить связь
      description: 'Связь с самой собой - 422 fields.targetTaskId = same_task; задача
        другого проекта или неизвестная - 422 fields.targetTaskId = not_found.
        Такая связь уже есть - 409 link_exists; связь замкнула бы цикл blocks -
        409 link_cycle. Право: `link-manage`.'
      x-permission: link-manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLinkRequest'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}/links/{linkId}:
    delete:
      operationId: deleteTaskLink
      tags: [ Links ]
      summary: Удалить связь (с любой из сторон)
      description: 'Удаляет связь, где taskId - любая из сторон; иначе 404. Право:
        `link-manage`.'
      x-permission: link-manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/LinkId'
      responses:
        '204':
          description: Удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}/urls:
    post:
      operationId: createTaskUrl
      tags: [ Links ]
      summary: Добавить ссылку
      description: 'url - корректный адрес http:// или https://, иначе 422 fields.url
        = invalid. Больше 50 ссылок на задачу - 422 fields.url = too_many.
        Пустой title хранится как null. Право: `link-manage`.'
      x-permission: link-manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUrlRequest'
      responses:
        '201':
          description: Создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalError'
  /tasks/{taskId}/urls/{urlId}:
    delete:
      operationId: deleteTaskUrl
      tags: [ Links ]
      summary: Удалить ссылку
      description: 'Право: `link-manage`.'
      x-permission: link-manage
      parameters:
        - $ref: '#/components/parameters/TaskId'
        - $ref: '#/components/parameters/UrlId'
      responses:
        '204':
          description: Удалена
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
