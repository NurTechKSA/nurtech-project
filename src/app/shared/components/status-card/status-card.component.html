<section tuiCardLarge appearance="floating">
  <tui-block-status size="m">
    <span
      tuiSlot="top"
      appearance="secondary"
      size="xl"
      [tuiAvatar]="icon()"></span>
    <h1>{{ heading() }}</h1>
    {{ description() }}
    <ng-container ngProjectAs="button">
      <button 
        tuiButton
        type="button"
        size="m"
        appearance="secondary"
        aria-label="Копировать ссылку"
        title="Копировать ссылку"
        (click)="copyLink()"
      >
        <tui-icon icon="@tui.copy"></tui-icon>
      </button>
    </ng-container>
  </tui-block-status>
</section>
