<form
  class="change-password-dialog"
  [formGroup]="changePasswordForm"
  (ngSubmit)="onSubmit()">
  <div class="change-password-dialog__fields">
    <div class="change-password-dialog__field">
      <tui-textfield>
        <label tuiLabel for="current-password">Текущий пароль *</label>
        <input
          id="current-password"
          tuiInput
          type="password"
          autocomplete="current-password"
          formControlName="currentPassword" />
        <tui-icon tuiPassword />
      </tui-textfield>
      <tui-error formControlName="currentPassword" />
    </div>
    <div class="change-password-dialog__field">
      <tui-textfield>
        <label tuiLabel for="new-password">Новый пароль *</label>
        <input
          id="new-password"
          tuiInput
          type="password"
          autocomplete="new-password"
          formControlName="newPassword" />
        <tui-icon tuiPassword />
      </tui-textfield>
      <p class="change-password-dialog__hint">
        Не менее 8 символов, буква и цифра
      </p>
      <tui-error formControlName="newPassword" />
    </div>
    <div class="change-password-dialog__field">
      <tui-textfield>
        <label tuiLabel for="confirm-password">Повтор пароля *</label>
        <input
          id="confirm-password"
          tuiInput
          type="password"
          autocomplete="new-password"
          formControlName="confirmPassword" />
        <tui-icon tuiPassword />
      </tui-textfield>
      <tui-error formControlName="confirmPassword" />
    </div>
  </div>
  <footer class="change-password-dialog__actions">
    <button
      appearance="secondary"
      class="change-password-dialog__button"
      size="l"
      tuiButton
      type="button"
      (click)="onCancel()">
      Отмена
    </button>
    <button
      appearance="primary"
      class="change-password-dialog__button"
      size="l"
      tuiButton
      type="submit"
      [disabled]="isLoading()">
      Сохранить
    </button>
  </footer>
</form>
