<form
  tuiForm
  class="change-password-dialog"
  [formGroup]="changePasswordForm"
  (ngSubmit)="onFormSubmit()">
  <tui-textfield>
    <label tuiLabel for="current-password">Текущий пароль *</label>
    <input
      id="current-password"
      tuiInput
      type="password"
      autocomplete="current-password"
      formControlName="currentPassword" />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error formControlName="currentPassword" />

  <tui-textfield>
    <label tuiLabel for="new-password">Новый пароль *</label>
    <input
      id="new-password"
      tuiInput
      type="password"
      autocomplete="new-password"
      formControlName="newPassword" />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error formControlName="newPassword" />

  <tui-textfield>
    <label tuiLabel for="confirm-password">Повтор пароля *</label>
    <input
      id="confirm-password"
      tuiInput
      type="password"
      autocomplete="new-password"
      formControlName="confirmPassword" />
    <tui-icon tuiPassword />
  </tui-textfield>
  <tui-error formControlName="confirmPassword" />

  <footer class="change-password-dialog__actions">
    <button
      appearance="secondary"
      class="change-password-dialog__button"
      size="l"
      tuiButton
      type="button"
      [disabled]="isLoading()"
      (click)="onCancel()">
      Отмена
    </button>

    <button
      appearance="primary"
      class="change-password-dialog__button"
      size="l"
      tuiButton
      type="submit"
      [loading]="isLoading()">
      Сохранить
    </button>
  </footer>
</form>
