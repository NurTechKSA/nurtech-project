<div class="create-task-main" [formGroup]="form()">
  <tui-segmented
    class="create-task-main__types"
    size="m"
    [activeItemIndex]="activeTypeIndex()"
    (activeItemIndexChange)="onTypeIndexChange($event)">
    @for (type of taskTypes; track type) {
      <button type="button" class="create-task-main__type-btn">
        <app-task-type-icon aria-hidden="true" [type]="type" />
        {{ typeLabels[type] }}
      </button>
    }
  </tui-segmented>

  <div class="create-task-main__field">
    <tui-textfield>
      <label tuiLabel for="create-task-title">Название *</label>
      <input
        id="create-task-title"
        tuiInput
        placeholder="Что нужно сделать"
        formControlName="title" />
    </tui-textfield>
    <tui-error formControlName="title" />
  </div>

  <div class="create-task-main__field">
    <span class="create-task-main__label">Описание</span>
    <tui-editor
      appMarkdownEditor
      class="create-task-main__editor"
      placeholder="Описание в формате markdown"
      formControlName="description" />
    <tui-error formControlName="description" />
  </div>
</div>
