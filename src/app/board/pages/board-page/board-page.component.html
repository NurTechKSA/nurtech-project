<tui-scrollbar class="board-scrollbar">
  <div class="board">
    @for (column of columns(); track column.statusId) {
      <app-board-column
        [column]="column"
        [completedDays]="board()?.doneWindowDays">
      </app-board-column>
    }
  </div>
</tui-scrollbar>
