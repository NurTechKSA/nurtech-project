<h1>Доска</h1>

<!-- TODO: заменить временный список полноценной версткой колонок и карточек -->
@for (column of columns(); track column.statusId) {
  <section>
    <h2>{{ column.name }}</h2>

    <ul>
      @for (card of column.cards; track card.id) {
        <li>{{ card.title }}</li>
      } @empty {
        <li>Нет карточек</li>
      }
    </ul>
  </section>
} @empty {
  <p>Колонки не найдены</p>
}
