<div class="board-column" [style.--column-accent]="column().color">
  <div class="board-column__accent"></div>

  <div class="board-column__header">
    <div class="board-column__title">
      {{ column().name }}
    </div>

    <div class="board-column__count">
      {{ column().count }}
    </div>
  </div>

  <tui-scrollbar class="board-column__scrollbar">
    <div class="board-column__content">
      <ng-content />
      @if (column().category === statusCategory.DONE && completedDays()) {
        <p class="board-column__text">закрытые за {{ completedDays() }} дней</p>
      }
    </div>
  </tui-scrollbar>
</div>
