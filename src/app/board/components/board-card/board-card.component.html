@let value = card();

<article class="board-card">
  <header class="board-card__header">
    <div class="board-card__identity">
      <app-task-type-icon [type]="value.type" />

      <span class="board-card__key">
        <app-task-key [key]="value.key" />
      </span>
    </div>

    <app-priority-badge [priority]="value.priority" />
  </header>

  <p class="board-card__title">{{ value.title }}</p>

  @if (value.tags.length || value.parent || value.blocked) {
    <div class="board-card__details">
      @if (value.tags.length) {
        <app-task-tags [limit]="maxVisibleTags" [tags]="value.tags" />
      }

      @if (value.parent || value.blocked) {
        <div class="board-card__badges">
          @if (value.parent; as parent) {
            <app-parent-task-key-badge [parentKey]="parent.key" />
          }

          @if (value.blocked) {
            <app-blocked-task-badge [isBlocked]="value.blocked" />
          }
        </div>
      }
    </div>
  }

  <footer class="board-card__footer">
    <div class="board-card__due-date">
      <app-task-due-date
        [dueDate]="value.dueDate"
        [isOverdue]="value.isOverdue" />
    </div>

    @if (value.assignee; as assignee) {
      <app-user-avatar size="s" [name]="assignee.name" />
    }
  </footer>
</article>
