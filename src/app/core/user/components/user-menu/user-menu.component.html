@if (currentUser(); as user) {
  <button
    tuiAvatar
    type="button"
    size="s"
    appearance="secondary"
    tuiDropdownAlign="end"
    aria-label="Меню пользователя"
    [tuiDropdown]="menu"
    [(tuiDropdownOpen)]="isOpen">
    {{ user.name | initials }}
  </button>

  <ng-template #menu>
    <tui-data-list class="user-menu__list" size="l">
      <p class="user-menu__caption">
        {{ user.name | shortName }} · &#64;{{ user.username }}
      </p>
      <a tuiOption [routerLink]="profilePath" (click)="onProfileClick()">
        Профиль
      </a>
      <hr />
      <button tuiOption type="button" (click)="onLogoutButtonClick()">
        Выйти
      </button>
      <!-- TODO: временные данные -->
      <app-test-user-switch />
    </tui-data-list>
  </ng-template>
}
