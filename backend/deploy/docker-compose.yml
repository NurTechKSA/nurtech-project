# Стенд: фронт и /api на одном домене за nginx-proxy сервера (сеть webproxy, SSL - acme-companion).
#   https://<DOMAIN>/      - сборка фронта (index.html на все адреса приложения)
#   https://<DOMAIN>/api   - бэкенд
# .env рядом (только на сервере): DOMAIN, DB_PASSWORD, DEV_SEED_PASSWORD.
services:
  db:
    logging: {driver: json-file, options: {max-size: "50m", max-file: "3"}}
    image: postgres:16-alpine
    container_name: tasks-db
    environment:
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: ${DB_PASSWORD:?задай DB_PASSWORD в .env}
      POSTGRES_DB: tasks
    volumes:
      - tasks_pgdata:/var/lib/postgresql/data
    networks: [internal]
    restart: always

  api:
    logging: {driver: json-file, options: {max-size: "50m", max-file: "3"}}
    build:
      context: ./repo-api
      dockerfile: backend/Dockerfile
    container_name: tasks-api
    environment:
      APP_ENV: staging
      PORT: 3000
      DATABASE_URL: postgres://tasks:${DB_PASSWORD}@db:5432/tasks
      APP_BASE_URL: https://${DOMAIN:?задай DOMAIN в .env}
      ALLOWED_ORIGINS: https://${DOMAIN},http://localhost:4200
      SESSION_TTL_DAYS: 7
      INVITATION_TTL_DAYS: 7
      DEV_SEED: ${DEV_SEED:-true}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-}
    depends_on: [db]
    networks: [internal]
    restart: always

  web:
    logging: {driver: json-file, options: {max-size: "50m", max-file: "3"}}
    image: nginx:1.27-alpine
    container_name: tasks-web
    environment:
      VIRTUAL_HOST: ${DOMAIN}
      VIRTUAL_PORT: 80
      LETSENCRYPT_HOST: ${DOMAIN}
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./www:/srv/www:ro
    depends_on: [api]
    networks: [internal, webproxy]
    restart: always

volumes:
  tasks_pgdata:

networks:
  internal:
  webproxy:
    external: true
