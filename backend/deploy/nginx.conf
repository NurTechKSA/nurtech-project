# Один origin: /api -> бэкенд, всё остальное - сборка фронта с отдачей index.html (SPA).
server {
  listen 80;
  server_name _;
  root /srv/www/current;
  client_max_body_size 1m;

  location ^~ /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
  }
  location = /api {
    proxy_pass http://api:3000;
  }

  # Файлы сборки с хешем в имени - надолго в кэш; index.html - всегда свежий
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|webp|ico)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
